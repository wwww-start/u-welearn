<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Answer Bot</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="glass.css">
</head>
<body>
  <div class="app">
    <!-- 顶部标题栏 -->
    <header class="app-header">
      <div class="brand">
        <span class="logo-icon">✦</span>
        <span class="title">AI Answer Bot</span>
        <div class="status-badge" id="statusBadge">
          <span class="status-dot" id="statusDot"></span>
          <span class="status-text" id="statusText" aria-live="polite">等待开始</span>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="openTemplatesBtn" title="模板管理">
          <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
        </button>
        <button class="icon-btn" id="openSettingsBtn" title="API 设置">
          <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
        </button>
      </div>
    </header>

    <!-- 主内容区域 -->
    <main class="app-content">
      <!-- 学习通专属面板（检测到 chaoxing / xuexitong 时显示） -->
      <div id="cxPanel" style="display:none;margin-bottom:12px">
        <div class="section-header" style="margin-bottom:8px">
          <span>学习通 · <span id="cxPageType">-</span></span>
          <button class="btn-text" id="cxRefresh">刷新</button>
        </div>

        <div class="action-row" style="display:flex;gap:6px">
          <button class="btn btn-primary" id="cxVideoBtn" style="flex:1">刷视频</button>
          <button class="btn btn-primary" id="cxAnswerBtn" style="flex:1">答题</button>
        </div>

        <label style="display:flex;align-items:center;gap:8px;margin:10px 4px;font-size:12px;color:#555;cursor:pointer">
          <input id="cxAutoAnswer" type="checkbox" checked>
          刷课时自动答题（不勾则只刷视频）
        </label>

        <div class="action-row" style="display:flex;gap:6px">
          <button class="btn btn-outline" id="cxStopBtn" style="flex:1">停止</button>
        </div>

        <div class="action-row" style="display:flex;gap:6px;margin-top:6px">
          <button class="btn btn-outline" id="cxVerifyBtn" style="flex:1">核对未作答</button>
          <button class="btn btn-primary" id="cxSubmitBtn" style="flex:1;background:#c0392b">确认提交</button>
        </div>
        <div style="font-size:11px;color:#c0392b;margin:6px 4px;line-height:1.5">
          ⚠ 默认<b>不会自动提交</b>。作答完成后请先核对，再点「确认提交」。
        </div>

        <label style="display:flex;align-items:center;gap:8px;margin:10px 4px;font-size:12px;color:#555">
          倍速
          <select id="cxRate" style="flex:1;padding:4px 6px;border-radius:6px;border:1px solid #ccd">
            <option value="1">1.0x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
            <option value="2" selected>2.0x</option>
            <option value="2.5">2.5x</option>
            <option value="3">3.0x</option>
            <option value="4">4.0x</option>
          </select>
        </label>

        <label style="display:flex;align-items:center;gap:8px;margin:6px 4px;font-size:12px;color:#555">
          <input id="cxSeekTail" type="checkbox">
          跳到最后一段（快速完成）
        </label>
        <label style="display:flex;align-items:center;gap:8px;margin:6px 4px;font-size:12px;color:#555">
          <input id="cxAutoNext" type="checkbox" checked>
          播完自动切下一任务点
        </label>

        <div id="cxInfo" style="font-size:12px;color:#60758d;margin:8px 4px;line-height:1.6"></div>
      </div>

      <!-- 统计卡片 -->
      <div class="stats-grid">
        <div class="stat-card">
          <span class="stat-value" id="questionCount">0</span>
          <span class="stat-label">题组 · 0 个空位</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="answeredCount">0</span>
          <span class="stat-label">已填写 · 0 个空位</span>
        </div>
      </div>
      <div id="submittedSummary" style="font-size:12px;color:#60758d;margin:8px">已确认提交 0 组</div>

      <div class="skip-summary platform-course-controls">已跳过 <strong id="skippedCount">0</strong> 页 · 跳过不计为完成</div>
      <!-- 操作区 -->
      <div class="steps-area platform-course-controls">
        <div class="action-row">
          <button class="btn btn-primary btn-lg" id="startBtn">
            <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
            <span id="startBtnText">自动答题</span>
          </button>
        </div>
        <label style="display:flex;align-items:center;gap:8px;margin:10px 4px;font-size:12px;color:#555">
          <input id="autoContinue" type="checkbox" checked>
          自动翻到下一页（U校园 / WE Learn）
        </label>
      </div>

      <label class="glass-switch-row platform-course-controls">
        <span><strong>一键跳过</strong><small>无法完成的页面记录后继续；两站共用</small></span>
        <input id="skipUnfinished" type="checkbox" role="switch" aria-label="一键跳过未完成页面">
      </label>
      <details class="usage-help">
        <summary>使用提示</summary>
        <div>
          <p>先在右上角配置模型，再打开具体课件页面开始操作。</p>
          <p>已填写、已提交和答对是不同状态；跳过的页面需要单独检查。</p>
          <p>学习通请先核对内容，再确认提交。API 密钥仅在本机设置中填写。</p>
        </div>
      </details>
      <!-- 简要日志区域 -->
      <div class="log-section">
        <div class="section-header">
          <span>运行日志</span>
          <button class="btn-text" id="clearLog">清空</button>
        </div>
        <div class="log-container" id="logContent">
          <div class="log-item log-info">
            <span class="log-time">--:--</span>
            <span class="log-msg">准备就绪，点击按钮开始自动答题</span>
          </div>
        </div>
      </div>
    </main>

    <!-- 设置浮层 (Modal) -->
    <div class="modal" id="settingsModal">
      <div class="modal-backdrop" id="closeSettingsBackdrop"></div>
      <div class="modal-content">
        <div class="modal-header">
          <h3>AI模型管理</h3>
          <button class="icon-btn" id="closeSettingsBtn" aria-label="关闭模型管理">
            <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
          </button>
        </div>
        <div class="modal-body">
          <div class="model-list" id="modelList"></div>
          <button class="btn btn-outline btn-block" id="testModelBtn">测试当前配置（一次简短请求）</button>
          <div id="modelTestStatus" style="margin:8px 0;overflow-wrap:anywhere" aria-live="polite"></div>
          <button class="btn btn-outline btn-block" id="addModelBtn">
            <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
            <span>添加自定义模型</span>
          </button>
        </div>
      </div>
    </div>

    <!-- 添加/编辑模型浮层 -->
    <div class="modal" id="editModelModal">
      <div class="modal-backdrop" id="closeEditBackdrop"></div>
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="editModalTitle">添加模型</h3>
          <button class="icon-btn" id="closeEditBtn" aria-label="关闭模型编辑">
            <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
          </button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label for="editName">模型名称</label>
            <input type="text" id="editName" placeholder="我的模型">
          </div>
          <div class="form-group">
            <label for="editBaseUrl">Base URL</label>
            <input type="text" id="editBaseUrl" placeholder="https://api.openai.com/v1">
          </div>
          <div class="form-group">
            <label for="editApiKey">API Key</label>
            <div class="input-wrapper">
              <input type="password" id="editApiKey" placeholder="sk-...">
              <button class="toggle-visibility" id="toggleEditApiKey" aria-label="显示或隐藏密钥">
                <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
              </button>
            </div>
          </div>
          <div class="form-group">
            <label for="editModel">模型ID</label>
            <input type="text" id="editModel" placeholder="gpt-4o-mini">
          </div>
          <div class="config-status" id="editStatus"></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-primary btn-block" id="saveModelBtn">保存并使用</button>
        </div>
      </div>
    </div>

  </div>
  <script src="popup.js"></script>
  <script src="platform-ui.js"></script>
  <script src="liquid-glass.js"></script>
</body>
</html>
